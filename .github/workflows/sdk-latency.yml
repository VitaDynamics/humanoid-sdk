name: SDK latency

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-latency-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  latency:
    # Stable required-check name. No path/draft filters, no continue-on-error.
    name: SDK latency report
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - name: Fetch and verify pinned official runtime wheels
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python tools/fetch_dependencies.py --output "$RUNNER_TEMP/wheelhouse"
      - name: Install pinned bindings
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-index "$RUNNER_TEMP"/wheelhouse/*.whl
          python -m pip check
      - name: Install build and test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install build==1.2.2.post1 scikit-build-core==0.11.6 pybind11==2.13.6 ninja==1.11.1.3 \
            -r demo_onnx/requirements-release.txt -r demo_onnx/requirements-test.txt pygame==2.6.1 mcap==1.3.1
      - name: Fetch and verify official ORT archive
        shell: bash
        run: |
          set -euo pipefail
          python tools/fetch_ort.py --output "$RUNNER_TEMP/onnxruntime.tgz"
      - name: Build SDK wheel and repair with public auditwheel
        shell: bash
        run: |
          set -euo pipefail
          CMAKE_ARGS="-DORT_ARCHIVE=$RUNNER_TEMP/onnxruntime.tgz" \
            python -m build --wheel --no-isolation --outdir "$RUNNER_TEMP/sdk-raw" . 2>&1 | tee "$RUNNER_TEMP/sdk-build.log"
          python -m auditwheel repair --only-plat --plat manylinux_2_35_x86_64 \
            --wheel-dir "$RUNNER_TEMP/sdk-wheel" "$RUNNER_TEMP"/sdk-raw/*.whl 2>&1 | tee "$RUNNER_TEMP/sdk-repair.log"
      - name: Install measured SDK wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-index --find-links "$RUNNER_TEMP/wheelhouse" "$RUNNER_TEMP"/sdk-wheel/*.whl
          python -m pip check
      - name: Build standalone C++ Mock
        shell: bash
        run: |
          set -euo pipefail
          python tests/latency/build_mock.py --build-dir "$RUNNER_TEMP/latency-build" 2>&1 | tee "$RUNNER_TEMP/latency-build.log"
      - name: Measure all frequencies (60 seconds each, sequential)
        shell: bash
        run: |
          set -euo pipefail
          python tests/latency/run.py --build-dir "$RUNNER_TEMP/latency-build" \
            --output "$RUNNER_TEMP/latency-results" --seconds 60 \
            --rates 50 100 200 300 400 500 600 700 800 900 1000
          python - <<'PY'
          import json, os, pathlib
          r = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'latency-results/results.json').read_text())
          if r['status'] != 'PASS' or len(r['results']) != 11:
              raise RuntimeError('incomplete full latency report')
          PY
      - name: Publish summary (including setup/test failures)
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, pathlib, sys
          sys.path.insert(0, 'tests/latency')
          from report import render
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'latency-results'
          if not (out / 'results.json').exists():
              out.mkdir(exist_ok=True)
              render(out, {'status': 'NOT_MEASURED', 'results': [],
                           'error': 'Setup/build failed or run interrupted; inspect job log.'})
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write((out / 'summary.md').read_text())
          PY
      - name: Upload HTML, raw CSV, JSON, logs and provenance
        id: report_artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdk-latency-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/latency-results/
            ${{ runner.temp }}/latency-build.log
            ${{ runner.temp }}/latency-build/build.json
            ${{ runner.temp }}/sdk-wheel/
            ${{ runner.temp }}/sdk-build.log
            ${{ runner.temp }}/sdk-repair.log
          if-no-files-found: error
          retention-days: 30
      - name: Add report download link to Summary
        if: ${{ always() && steps.report_artifact.outputs.artifact-url != '' }}
        env:
          REPORT_URL: ${{ steps.report_artifact.outputs.artifact-url }}
        shell: bash
        run: |
          printf '\n[下载完整报告 ZIP（含 report.html、CSV、JSON）](%s)\n' "$REPORT_URL" >> "$GITHUB_STEP_SUMMARY"

  native-wheel:
    name: SDK native wheel tests
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - name: Fetch and verify pinned official runtime wheels
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python tools/fetch_dependencies.py --output "$RUNNER_TEMP/wheelhouse"
      - name: Install build and test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install build==1.2.2.post1 scikit-build-core==0.11.6 pybind11==2.13.6 ninja==1.11.1.3 \
            -r demo_onnx/requirements-release.txt -r demo_onnx/requirements-test.txt pygame==2.6.1 mcap==1.3.1
      - name: Fetch and verify official ORT archive
        shell: bash
        run: |
          set -euo pipefail
          python tools/fetch_ort.py --output "$RUNNER_TEMP/onnxruntime.tgz"
      - name: Build SDK wheel and repair with public auditwheel
        shell: bash
        run: |
          set -euo pipefail
          CMAKE_ARGS="-DORT_ARCHIVE=$RUNNER_TEMP/onnxruntime.tgz" \
            python -m build --wheel --no-isolation --outdir "$RUNNER_TEMP/sdk-raw" . 2>&1 | tee "$RUNNER_TEMP/sdk-build.log"
          python -m auditwheel repair --only-plat --plat manylinux_2_35_x86_64 \
            --wheel-dir "$RUNNER_TEMP/sdk-wheel" "$RUNNER_TEMP"/sdk-raw/*.whl 2>&1 | tee "$RUNNER_TEMP/sdk-repair.log"
      - name: Install and test the actual SDK wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-index --find-links "$RUNNER_TEMP/wheelhouse" "$RUNNER_TEMP"/sdk-wheel/*.whl
          python -m pip check
          python - <<'PY_CHECK'
          from pathlib import Path
          import sys, locomotion_aorta
          assert Path(locomotion_aorta.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
          assert not any(name.startswith('locomotion_aorta._onnx') for name in sys.modules)
          PY_CHECK
          python -c 'import numpy, yaml'  # Velocity coverage must not skip for missing demo dependencies.
          PYTHONPATH=.:tests python -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/sdk-tests.log"
          python -m unittest discover -s demo_onnx/tests -v 2>&1 | tee "$RUNNER_TEMP/native-tests.log"
          python tests/latency/state_source_probe.py --output "$RUNNER_TEMP/state-source-results"
      - name: Compile production-topic Mock and run real two-node IPC smoke
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY_DOWNLOAD'
          import importlib.util, os, pathlib, urllib.request
          spec = importlib.util.spec_from_file_location('benchmark_build', 'tests/latency/build_mock.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          with urllib.request.urlopen(module.FB_URL, timeout=120) as response:
              pathlib.Path(os.environ['RUNNER_TEMP'], 'flatbuffers.tar.gz').write_bytes(response.read())
          PY_DOWNLOAD
          python tools/production_topic_mock/build.py --build-dir "$RUNNER_TEMP/production-mock" \
            --flatbuffers-archive "$RUNNER_TEMP/flatbuffers.tar.gz" --run-protocol-checks
          python -m unittest tools.production_topic_mock.test_group_contract -v
          MOCK_BUILD_DIR="$RUNNER_TEMP/production-mock" python -m unittest tools.production_topic_mock.test_ipc -v
      - name: Upload wheel, tests and partial failure evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdk-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/sdk-raw/
            ${{ runner.temp }}/sdk-wheel/
            ${{ runner.temp }}/sdk-build.log
            ${{ runner.temp }}/sdk-repair.log
            ${{ runner.temp }}/sdk-tests.log
            ${{ runner.temp }}/native-tests.log
            ${{ runner.temp }}/state-source-results/
          if-no-files-found: error
          retention-days: 30
