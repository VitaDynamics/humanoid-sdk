[build-system]
requires = ["scikit-build-core==0.11.6", "pybind11==2.13.6", "ninja==1.11.1.3"]
build-backend = "scikit_build_core.build"

[project]
name = "locomotion-aorta"
version = "0.2.1"
description = "VITA humanoid Aorta client with a lazy native ONNX demo backend"
requires-python = "==3.10.*"
dependencies = [
    "aorta-sdk==2026.10.20",
    "aorta-msgs==2026.10.20",
    "vbot-humanoid-msgs==0.0.0+g993f2f9de12b",
    "flatbuffers==25.12.19",
]

readme = "README.md"
license-files = [
    "demo_onnx/cpp/body_cmd_vendor/LICENSE",
    "demo_onnx/licenses/onnxruntime/LICENSE",
    "demo_onnx/licenses/onnxruntime/ThirdPartyNotices.txt",
    "demo_onnx/licenses/pybind11/LICENSE",
]

[project.optional-dependencies]
state-arrays = ["numpy==1.26.4"]
hil = ["mcap==1.3.1", "numpy==1.26.4"]
teleop-demo = [
    "numpy; python_version == '3.10' and platform_python_implementation == 'CPython' and sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
]

velocity-demo = ["numpy==1.26.4", "PyYAML"]
wbc-tracking-demo = ["numpy==1.26.4", "mcap==1.3.1"]

[tool.scikit-build]
cmake.version = ">=3.20"
cmake.build-type = "Release"
install.strip = false
wheel.packages = ["python/locomotion_aorta"]
build-dir = "build/{wheel_tag}"
