[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "locomotion-aorta"
version = "0.2.0"
description = "Python-only client for VITA humanoid locomotion over Aorta"
requires-python = ">=3.10"
dependencies = [
    "aorta-sdk==2026.10.12",
    "aorta-msgs==2026.10.12",
    "vbot-humanoid-msgs==0.1.2",
    "flatbuffers==25.9.23",
]

[project.optional-dependencies]
hil = ["mcap==1.3.1"]
teleop-demo = [
    "locomotion-aorta-demo-onnx==0.2.0; python_version == '3.10' and platform_python_implementation == 'CPython' and sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
    "pygame; python_version == '3.10' and platform_python_implementation == 'CPython' and sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
include = ["locomotion_aorta*"]
