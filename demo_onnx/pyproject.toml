[build-system]
requires = ["scikit-build-core==0.11.6", "pybind11==2.13.6", "ninja==1.11.1.3"]
build-backend = "scikit_build_core.build"

[project]
name = "locomotion-aorta-demo-onnx"
version = "0.2.0"
description = "Optional CPU ONNX inference backend for humanoid SDK demos"
requires-python = "==3.10.*"
dependencies = ["numpy"]
readme = "README.md"
license-files = [
  "licenses/onnxruntime/LICENSE",
  "licenses/onnxruntime/ThirdPartyNotices.txt",
  "python/locomotion_aorta_demo_onnx/licenses/pybind11/LICENSE",
]


[tool.scikit-build]
cmake.version = ">=3.20"
cmake.build-type = "Release"
install.strip = false
wheel.packages = ["python/locomotion_aorta_demo_onnx"]
build-dir = "build/{wheel_tag}"
